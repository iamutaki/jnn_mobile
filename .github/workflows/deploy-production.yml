name: Deploy (Production)

# Builds the `production` flavor from the main branch and publishes a GitHub
# Release. Obtainium reads GitHub Releases to install/update the app.
#
# Before merging to main, bump `version:` in pubspec.yaml so Obtainium detects
# a new version. Pushes without a bump refresh the existing release in place.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required to create the tag + GitHub Release.
permissions:
  contents: write

env:
  FLAVOR: production
  FLUTTER_VERSION: "3.44.1"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Decode keystore & write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          VERSION_NAME=$(echo "$VERSION_LINE" | sed 's/version: *//' | cut -d+ -f1)
          VERSION_CODE=$(echo "$VERSION_LINE" | sed 's/version: *//' | cut -d+ -f2)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION_NAME+$VERSION_CODE"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build release APKs (production, split per ABI)
        run: flutter build apk --release --obfuscate --split-per-abi --split-debug-info=./debug-info --flavor "$FLAVOR" -t lib/main.dart

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: production-v${{ steps.version.outputs.name }}
          name: JNN Mobile (Production) v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/*.apk
          make_latest: true
