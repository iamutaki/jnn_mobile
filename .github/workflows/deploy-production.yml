name: Deploy (Production)

# Builds the `production` flavor and publishes a GitHub Release. Triggered by
# pushing a semantic-version tag (e.g. `v1.0.0`) — the tag IS the version and
# the single source of truth. Obtainium reads GitHub Releases to install/update.

on:
  push:
    tags:
      # Push `v1.0.0` to cut a production release.
      - 'v*'
  workflow_dispatch:

# Required to create the tag + GitHub Release.
permissions:
  contents: write

env:
  FLAVOR: production
  FLUTTER_VERSION: "3.44.1"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit-count build number is accurate.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Decode keystore & write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Resolve production version from tag
        id: version
        # The git tag is the source of truth (`v1.0.0` -> 1.0.0). On a manual
        # workflow_dispatch run (no tag), fall back to pubspec.yaml.
        # versionCode = commit count (monotonic, never decreases).
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          fi
          CODE=$(git rev-list --count HEAD)
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}"    >> "$GITHUB_OUTPUT"
          echo "Production version: ${VERSION}+${CODE}"

      - name: Write resolved version into pubspec.yaml
        run: |
          sed -i "s|^version:.*|version: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}|" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build release APKs (production, split per ABI)
        run: flutter build apk --release --obfuscate --split-per-abi --split-debug-info=./debug-info --flavor "$FLAVOR" -t lib/main.dart

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: JNN Mobile (Production) v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/*.apk
          make_latest: true
