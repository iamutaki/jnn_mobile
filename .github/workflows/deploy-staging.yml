name: Deploy (Staging)

# Builds the `staging` flavor from the develop branch and publishes a GitHub
# Release (NOT marked as latest). Obtainium reads GitHub Releases to
# install/update the app.
#
# Staging version is auto-incremented: patch + buildNumber both equal the
# commit count, so they advance by 1 on every push without mutating the repo.
# Bump major.minor in pubspec.yaml manually when you need a new minor/major.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Required to create the tag + GitHub Release.
permissions:
  contents: write

env:
  FLAVOR: staging
  FLUTTER_VERSION: "3.44.1"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit-count build number is accurate.
          # Default fetch-depth is 1, which would always yield 1.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Decode keystore & write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Resolve staging version (auto-increment)
        id: version
        # patch + buildNumber both = commit count -> +1 every push, no commit-back.
        # major.minor is taken from pubspec.yaml.
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          MAJOR_MINOR=$(printf '%s' "$BASE" | awk -F. '{print $1"."$2}')
          N=$(git rev-list --count HEAD)
          echo "name=${MAJOR_MINOR}.${N}" >> "$GITHUB_OUTPUT"
          echo "code=${N}"              >> "$GITHUB_OUTPUT"
          echo "Staging version: ${MAJOR_MINOR}.${N}+${N}"

      - name: Write resolved version into pubspec.yaml
        run: |
          sed -i "s|^version:.*|version: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}|" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build release APKs (staging, split per ABI)
        run: flutter build apk --release --obfuscate --split-per-abi --split-debug-info=./debug-info --flavor "$FLAVOR" -t lib/main.dart

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-v${{ steps.version.outputs.name }}
          name: JNN Mobile (Staging) v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/*.apk
          # Staging must never steal the "latest release" flag from production.
          make_latest: "false"
